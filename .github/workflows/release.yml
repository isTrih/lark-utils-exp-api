name: Release kp-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Check version, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

  build:
    name: Build ${{ matrix.filename }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: bun-darwin-arm64
            filename: kp-cli-macos-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            filename: kp-cli-macos-x64
          - runner: windows-latest
            target: bun-windows-x64
            filename: kp-cli-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Build standalone executable
        run: bun run scripts/build.ts ${{ matrix.target }}

      - name: Smoke test native executable
        if: matrix.target == 'bun-darwin-arm64' || matrix.target == 'bun-darwin-x64'
        run: ./dist/${{ matrix.filename }} version

      - name: Smoke test Windows executable
        if: matrix.target == 'bun-windows-x64'
        shell: pwsh
        run: .\dist\${{ matrix.filename }} version

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          cd release
          test -f kp-cli-macos-arm64
          test -f kp-cli-macos-x64
          test -f kp-cli-windows-x64.exe
          sha256sum kp-cli-macos-arm64 kp-cli-macos-x64 kp-cli-windows-x64.exe \
            | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/kp-cli-macos-arm64 \
            release/kp-cli-macos-x64 \
            release/kp-cli-windows-x64.exe \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "kp-cli $GITHUB_REF_NAME"
